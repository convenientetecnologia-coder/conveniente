    // 4.1 Helpers base (sleep/wait, formatadores):
    function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

    async function waitUntil(fnCond, { timeoutMs = 20000, intervalMs = 300 } = {}) {
      const t0 = Date.now();
      let lastError = null;
      let errorCount = 0;
      while ((Date.now() - t0) < timeoutMs) {
        try { 
          if (await fnCond()) return true; 
        } catch (e) {
          // CORREÇÃO 8: Loga erros ao invés de esconder (mas continua tentando)
          errorCount++;
          lastError = e;
          // Loga apenas a cada 5 erros para não poluir console
          if (errorCount % 5 === 0) {
            console.warn('[waitUntil] Erro na condição (continuando)', e && e.message || e, `(${errorCount} erros)`);
          }
        }
        await sleep(intervalMs);
      }
      // CORREÇÃO 8: Se timeout e houve erros, loga o último erro
      if (lastError && errorCount > 0) {
        console.warn('[waitUntil] Timeout após', errorCount, 'erros. Último erro:', lastError && lastError.message || lastError);
      }
      return false;
    }

    // ======================= INÍCIO ALTERAÇÃO BLOQUEIO RAM "ABRIR TODOS" ========================
    // NOVO ensureResourcesOk({ minFreeMB }) militar
    async function ensureResourcesOk({ minFreeMB = 3072 } = {}) {
      const ok = await waitUntil(async () => {
        const m = await window.electronAPI.getSysMetrics().catch(()=>null);
        if (!m || !m.mem) return false;
        const freeMB = m.mem.freeMB || 0;
        const cpu    = (m.cpu && typeof m.cpu.percent === 'number') ? m.cpu.percent : 0;
        const cpuOk  = (cpu === 0) ? true : (cpu <= 90);
        const memOk  = freeMB >= minFreeMB;
        return cpuOk && memOk;

      // - inicia lock de mapeamento (open_all_map)

      if (startAllLock) { alert('Abertura em massa já está em andamento.'); return; }

      try {

          headers: { 'Content-Type': 'application/json', 'x-operator': 'ui_open_all' },
          body: JSON.stringify({})
        }).then(x => x.json()).catch(()=>null);
        if (!r || r.ok !== true) throw new Error((r && r.error) ? String(r.error) : 'open_all_failed');
        // Idempotente: se já está rodando, não tratar como falha (evita “2º clique = erro”).
        // Feedback pro humano: o 2º clique costuma vir da sensação de “não aconteceu nada”.
        if (r && r.alreadyRunning === true) {
          try { alert('Abrir Todos já está em andamento (modo seguro). Vou atualizar o painel.'); } catch {}

        // Deixa rodar em background; o painel acompanha por status.
        await new Promise(r => setTimeout(r, 500));

        if (startBtn) { startBtn.disabled = false; startBtn.style.opacity = ''; startBtn.style.cursor = ''; startBtn.textContent = 'Abrir Todos 24h'; }
        setGlobalActionButtonsDisabled(false);
        startAllLock = false;
      }
    }

    async function invocarHumanoUI(p, btn) {
      try {

        let st = await window.electronAPI.getStatus();
        let cur = (st.perfis || []).find(x => x.nome === p.nome);
        if (!cur || !cur.active) {
          const ok = confirm(`O navegador da conta "${p.label || p.nome}" está fechado. Abrir e invocar humano agora?`);
          if (!ok) { setBtnLoading(btn, false); return; }
          await window.electronAPI.activate(p.nome);
          await waitUntil(async () => {
            const s2 = await window.electronAPI.getStatus();
            const c2 = (s2.perfis || []).find(x => x.nome === p.nome);
            return c2 && c2.active;
          }, { timeoutMs: 60000, intervalMs: 400 });
        }
        // Se Robe estiver executando para esta conta, aguarda finalizar
        st = await window.electronAPI.getStatus();
        const emExec = !!(st && st.robes && st.robes[p.nome] && st.robes[p.nome].emExecucao);
        if (emExec) {
          setBtnLoading(btn, true, 'Aguardando Robe concluir...');
          await waitRobeFinish(p.nome);

    async function startWorkUI(p, btn) {
      try {
        setBtnLoading(btn, true, 'Iniciando...');
        // Garante navegador ativo
        let st = await window.electronAPI.getStatus();
        let cur = (st.perfis || []).find(x => x.nome === p.nome);
        if (!cur || !cur.active) {
          await window.electronAPI.activate(p.nome);
          await waitUntil(async () => {
            const s2 = await window.electronAPI.getStatus();
            const c2 = (s2.perfis || []).find(x => x.nome === p.nome);
            return c2 && c2.active;
          }, { timeoutMs: 60000, intervalMs: 400 });
          await new Promise(r=>setTimeout(r,1000));
        }
        // Inicia Virtus/24h
        await window.electronAPI.startWork(p.nome);
        await waitUntil(async () => {
          const s3 = await window.electronAPI.getStatus();
          const c3 = (s3.perfis || []).find(x => x.nome === p.nome);
          return c3 && c3.trabalhando;
        }, { timeoutMs: 30000, intervalMs: 400 });
        reloadPerfis();
      } catch (e) {
        alert('Falha ao iniciar 24h: ' + (e && e.message || e));
      } finally {
        setBtnLoading(btn, false);
      }
    }

    // 4.4) Fechar todos em PARALELO com limite de concorrência (RÁPIDO e CONFIÁVEL)
    async function stopAllSequential() {
      // Militar/enterprise: o painel NÃO deve “brigar” com o nurse fechando perfil-a-perfil
      // (o nurse reabre porque desired.active continua true).
      //
      // O fluxo canônico é: /api/perfis/close-all
      // - PASSO ATÔMICO: desired.active=false para todos (corta reaberturas)
      // - Loop robusto: deactivate com retry e hard-close
      if (stopAllLock) { alert('Fechamento em massa já está em andamento.'); return; }
      if (startAllLock) { alertMassActionRunning(); return; }
      stopAllLock = true;
      setGlobalActionButtonsDisabled(true);
      const stopBtn = document.getElementById('stopAllBtn');
      if (stopBtn) { stopBtn.disabled = true; stopBtn.style.opacity = '0.7'; stopBtn.style.cursor = 'not-allowed'; stopBtn.textContent = 'Fechando (modo seguro)...'; }
      try {
        const r = await fetch('/api/perfis/close-all', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-operator': 'ui_close_all' },
          body: JSON.stringify({})
        }).then(x => x.json()).catch(()=>null);
        if (!r || r.ok !== true) {
          const err = (r && r.cancelled) ? 'close_all_cancelled' : ((r && r.error) ? String(r.error) : 'close_all_failed');
          throw new Error(err);
        }
        reloadPerfis();
      } catch (e) {
        alert('Falha ao fechar todos (modo seguro): ' + (e && e.message || e));
      } finally {
        if (stopBtn) { stopBtn.disabled = false; stopBtn.style.opacity = ''; stopBtn.style.cursor = ''; stopBtn.textContent = 'Fechar Todos'; }
        setGlobalActionButtonsDisabled(false);
        stopAllLock = false;
      }
    }

                  <div><b>beta (insight)</b>: aumenta a agressividade do “insight baixo recebe mais”. ↑beta ⇒ quem tem insight menor puxa mais slots; ↓beta ⇒ distribuição fica mais uniforme (menos sensível ao insight).</div>
                  <div><b>minBoost / maxBoost</b>: limites do multiplicador de insight. ↑maxBoost ⇒ pode concentrar mais em quem está “ruim”; ↓maxBoost ⇒ evita explosões. ↑minBoost ⇒ não deixa ninguém ficar “seco” por insight alto.</div>
                  <div><b>noDriversFactor</b>: penalidade quando <b>motoristas=0</b>. ↓noDriversFactor ⇒ quase não recebe slots; ↑noDriversFactor ⇒ mesmo sem motoristas ainda recebe mais (use com cuidado).</div>
                  <div><b>lowDriversMinFactor</b>: piso para cidades com poucos motoristas (mas >0). ↑ ⇒ menos penalidade; ↓ ⇒ penaliza mais.</div>
                  <div><b>lowDriversGamma</b>: curva da penalidade por “poucos motoristas”. ↑gamma ⇒ penaliza mais forte quando tem pouco; ↓gamma ⇒ transição mais suave.</div>
                  <div><b>driverBonusGamma / driverBonusCap</b>: bônus para cidades com <b>mais motoristas</b> que a mediana. ↑gamma ⇒ favorece mais quem tem mais motoristas; ↓gamma ⇒ reduz esse efeito. ↑cap ⇒ permite bônus maior; ↓cap ⇒ limita.</div>
                  <div><b>antiStreakPenalty</b>: evita repetir a mesma cidade em sequência na fila. ↓ ⇒ repete menos (fila mais alternada); ↑ ⇒ fila pode ter mais repetições quando uma cidade tem muitos slots.</div>
                  <div><b>statsWindowDays</b>: janela de cálculo no CT (chamados/insight). ↑dias ⇒ mais “estável” (menos ruído); ↓dias ⇒ mais “tempo real” (mais variação).</div>
                  <div><b>prefetchRatio / prefetchMin / prefetchMax</b>: quando gerar próximo bloco antes de zerar a fila. ↑ ⇒ gera mais cedo; ↓ ⇒ gera mais tarde. (Não muda o peso; só o momento do reabastecimento.)</div>
                </div>
              </div>
            </details>
            <div class="modal-actions">
              <button class="btn" id="v2TuneCancel">Cancelar</button>
              <button class="btn btn-cinza" id="v2TuneFactory">Restaurar padrão (fábrica)</button>
              <button class="btn primary" id="v2TuneSave">Salvar e recalcular</button>
            </div>
          `;
          overlay2.append(box2);
          document.body.append(overlay2);

          const close2 = () => { try { overlay2.remove(); } catch {} };
          box2.querySelector('#v2TuneCancel').onclick = close2;
          overlay2.onclick = (ev) => { if (ev.target === overlay2) close2(); };

          box2.querySelector('#v2TuneFactory').onclick = async () => {
            if (!confirm('Restaurar os parâmetros padrão de fábrica e recalcular a fila agora?')) return;
            const setVal = (id, v) => { try { const el = box2.querySelector(id); if (el) el.value = String(v); } catch {} };
            setVal('#v2_alpha', factory.alpha);
            setVal('#v2_beta', factory.beta);
            setVal('#v2_minBoost', factory.minBoost);
            setVal('#v2_maxBoost', factory.maxBoost);
            setVal('#v2_noDriversFactor', factory.noDriversFactor);
            setVal('#v2_lowDriversMinFactor', factory.lowDriversMinFactor);
            setVal('#v2_lowDriversGamma', factory.lowDriversGamma);
            setVal('#v2_driverBonusGamma', factory.driverBonusGamma);
            setVal('#v2_driverBonusCap', factory.driverBonusCap);
            setVal('#v2_antiStreakPenalty', factory.antiStreakPenalty);
            setVal('#v2_statsWindowDays', factory.statsWindowDays);
            setVal('#v2_prefetchRatio', factory.prefetchRatio);
            setVal('#v2_prefetchMin', factory.prefetchMin);
            setVal('#v2_prefetchMax', factory.prefetchMax);

            const btn = box2.querySelector('#v2TuneFactory');
            const idleTxt = btn.textContent;
            const btnSave = box2.querySelector('#v2TuneSave');
            const btnCancel = box2.querySelector('#v2TuneCancel');
            btn.disabled = true; btn.style.opacity = '0.7'; btn.textContent = 'Restaurando...';
            btnSave.disabled = true; btnSave.style.opacity = '0.7';
            btnCancel.disabled = true; btnCancel.style.opacity = '0.7';
            try {
              await saveServerConfig({ robe: { v2Tuning: factory } }, { applyNow: false });
              close2();
              await loadPage({ reset: true });
            } catch (e) {
              alert('Falha ao restaurar padrão: ' + (e && e.message || e));
            } finally {
              btn.disabled = false; btn.style.opacity = ''; btn.textContent = idleTxt;
              btnSave.disabled = false; btnSave.style.opacity = '';
              btnCancel.disabled = false; btnCancel.style.opacity = '';
            }
          };

          box2.querySelector('#v2TuneSave').onclick = async () => {
            const read = (id) => (box2.querySelector(id) && box2.querySelector(id).value) || '';
            const alpha = parseNum(read('#v2_alpha'));
            const beta = parseNum(read('#v2_beta'));
            const minBoost = parseNum(read('#v2_minBoost'));
            const maxBoost = parseNum(read('#v2_maxBoost'));
            const noDriversFactor = parseNum(read('#v2_noDriversFactor'));
            const lowDriversMinFactor = parseNum(read('#v2_lowDriversMinFactor'));
            const lowDriversGamma = parseNum(read('#v2_lowDriversGamma'));
            const driverBonusGamma = parseNum(read('#v2_driverBonusGamma'));
            const driverBonusCap = parseNum(read('#v2_driverBonusCap'));
            const antiStreakPenalty = parseNum(read('#v2_antiStreakPenalty'));
            const statsWindowDays = parseIntSafe(read('#v2_statsWindowDays'));
            const prefetchRatio = parseNum(read('#v2_prefetchRatio'));
            const prefetchMin = parseIntSafe(read('#v2_prefetchMin'));
            const prefetchMax = parseIntSafe(read('#v2_prefetchMax'));

            const next = {
              alpha: alpha == null ? 0.10 : clamp(alpha, 0, 0.6),
              beta: beta == null ? 1.0 : clamp(beta, 0.05, 6.0),
              minBoost: minBoost == null ? 0.35 : clamp(minBoost, 0.01, 2.0),
              maxBoost: maxBoost == null ? 3.0 : clamp(maxBoost, 1.0, 20.0),
              noDriversFactor: noDriversFactor == null ? 0.06 : clamp(noDriversFactor, 0, 1),
              lowDriversMinFactor: lowDriversMinFactor == null ? 0.22 : clamp(lowDriversMinFactor, 0, 1),
              lowDriversGamma: lowDriversGamma == null ? 0.70 : clamp(lowDriversGamma, 0.05, 6.0),
              driverBonusGamma: driverBonusGamma == null ? 0.25 : clamp(driverBonusGamma, 0, 2.0),
              driverBonusCap: driverBonusCap == null ? 1.25 : clamp(driverBonusCap, 1.0, 3.0),
              antiStreakPenalty: antiStreakPenalty == null ? 0.35 : clamp(antiStreakPenalty, 0.01, 1),
              statsWindowDays: statsWindowDays == null ? 3 : clamp(statsWindowDays, 1, 10),
              prefetchRatio: prefetchRatio == null ? 0.10 : clamp(prefetchRatio, 0.01, 0.8),
              prefetchMin: prefetchMin == null ? 5 : clamp(prefetchMin, 1, 200),
              prefetchMax: prefetchMax == null ? 20 : clamp(prefetchMax, 1, 500)
            };
            const idleTxt = box2.querySelector('#v2TuneSave').textContent;
            box2.querySelector('#v2TuneSave').disabled = true;
            box2.querySelector('#v2TuneSave').style.opacity = '0.7';
            box2.querySelector('#v2TuneSave').textContent = 'Salvando...';
            try {
              await saveServerConfig({ robe: { v2Tuning: next } }, { applyNow: false });
              close2();
              await loadPage({ reset: true });
            } catch (e) {
              alert('Falha ao salvar tuning: ' + (e && e.message || e));
            } finally {
              box2.querySelector('#v2TuneSave').disabled = false;
              box2.querySelector('#v2TuneSave').style.opacity = '';
              box2.querySelector('#v2TuneSave').textContent = idleTxt;
            }
          };
        } catch (e) {
          alert('Falha ao abrir configuração: ' + (e && e.message || e));
        }
      };
      btnRecalc.onclick = async () => {
        if (loading) return;
        const idleTxt = btnRecalc.textContent;
        const prevMore = btnMore.disabled;
        const prevRefresh = btnRefresh.disabled;
        btnRecalc.disabled = true; btnRecalc.style.opacity = '0.7'; btnRecalc.textContent = 'Recalculando...';
        btnMore.disabled = true;
        btnRefresh.disabled = true;
        try {
          const r = await fetch('/api/robes/v2/recalc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-operator': 'ui_robe_postings_recalc' },
            body: JSON.stringify({})
          }).then(x => x.json()).catch(()=>null);
          if (!r || r.ok !== true) throw new Error((r && (r.error || r.message)) ? (r.error || r.message) : 'recalc_failed');
          const rr = r && r.result ? r.result : null;
          if (rr && rr.ok === false) {
            const err = rr.error ? String(rr.error) : 'worker_recalc_failed';
            throw new Error(err);
          }
          await loadPage({ reset: true });
        } catch (e) {
          alert('Falha ao recalcular: ' + (e && e.message || e));
        } finally {
          btnRecalc.disabled = false; btnRecalc.style.opacity = ''; btnRecalc.textContent = idleTxt;
          btnMore.disabled = prevMore;
          btnRefresh.disabled = prevRefresh;
        }
      };
      btnClose.onclick = () => { try { overlay.remove(); } catch {} };
      overlay.onclick = (ev) => { if (ev.target === overlay) { try { overlay.remove(); } catch {} } };

      loadPage({ reset: true }).catch(()=>{});
    }

    // Toolbar: botão "Postagens"
    (function bindRobePostingsBtn(){
      const btn = document.getElementById('robePostingsBtn');
      if (!btn) return;
      btn.onclick = async () => {
        try { showRobePostingsModal(); } catch (e) { alert('Falha ao abrir modal: ' + (e && e.message || e)); }
      };
    })();

    // Bind do botão "Retomar Tudo"
    (function bindResumeAllBtn(){
      const btn = document.getElementById('resumeAllBtn');
      if (!btn) return;
      btn.onclick = async () => {
        if (isMassActionRunning()) { alertMassActionRunning(); return; }
        const idleTxt = btn.textContent;
        massMiscLock = true;
        btn.disabled = true; btn.style.opacity='0.7'; btn.textContent='Retomando...';
        setGlobalActionButtonsDisabled(true, { exclude: ['resumeAllBtn'] });
        try {
          const r = await window.electronAPI.resumeHumanAllActive();
          if (!r || !r.ok) {
            alert('Falha ao retomar trabalho em massa: ' + ((r && r.error) || ''));
          }
          await new Promise(r=>setTimeout(r,500));
          reloadPerfis();
        } catch (e) {
          alert('Erro no Retomar Tudo: ' + (e && e.message || e));
        } finally {
          massMiscLock = false;
          btn.disabled = false; btn.style.opacity=''; btn.textContent = idleTxt;
          setGlobalActionButtonsDisabled(false);
        }
      };
    })();

    reloadPerfis();
    setInterval(reloadPerfis, 5000);

    // Chamada inicial das métricas:
    updateSysMetrics();

    // Ajuste dinâmico e robusto do offset das barras fixas e padding do conteúdo
    (function initStickyToolbarOffset(){
      try {
        const header = document.querySelector('header');
        const toolbar = document.querySelector('.toolbar-sticky');
        const wrap = document.querySelector('.wrap');
        if (!header || !toolbar || !wrap) return;

        const apply = () => {
          // Garante FIXAÇÃO ABSOLUTA
          header.style.position = 'fixed';
          header.style.top = '0px';
          header.style.left = '0px';
          header.style.width = '100%';

          // Altura real do header
          const h = Math.ceil(header.getBoundingClientRect().height || header.offsetHeight || 0);

          // Toolbar fixa, imediatamente abaixo do header
          toolbar.style.position = 'fixed';
          toolbar.style.top = (isNaN(h) ? 0 : h) + 'px';
          toolbar.style.left = '0px';
          toolbar.style.width = '100%';

          // Altura real da toolbar
          const t = Math.ceil(toolbar.getBoundingClientRect().height || toolbar.offsetHeight || 0);

          // Padding-top do conteúdo: header + toolbar + pequeno gap
          const extraGap = 6;
          const pad = (isNaN(h) ? 0 : h) + (isNaN(t) ? 0 : t) + extraGap;
          wrap.style.paddingTop = pad + 'px';
        };

        // Aplica já no início
        apply();

        // Atualiza em redimensionamentos (desktop/mobile)
        window.addEventListener('resize', apply);
        window.addEventListener('orientationchange', apply);

        // Observa mudanças de tamanho do header (quebras de linha das métricas, etc.)
        if (window.ResizeObserver) {
          const ro = new ResizeObserver(apply);
          ro.observe(header);
          ro.observe(toolbar);
          // Guarda referência para evitar coleta prematura em alguns engines
          window.__headerResizeObserver = ro;
        }

        // Observa mutações no conteúdo do header (troca de textos das métrricas)
        if (window.MutationObserver) {
          const mo = new MutationObserver(apply);
          mo.observe(header, { childList: true, subtree: true, characterData: true });
          window.__headerMutationObserver = mo;
        }

        // Ajuste tardio para casos de fontes/carregamento assíncrono
        setTimeout(apply, 200);
      } catch (e) {
        // Fallback: CSS top default atua
      }
    })();

  </script>

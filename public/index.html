<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerenciador de Contas — Conveniente Tecnologia</title>
  <style>
    :root{ --bg:#0e1420; --card:#111826; --card2:#0f1723; --border:#1f2a3a; --text:#e8eef8; --muted:#9fb2cf; --brand:#3c82f6; --brand2:#1f6be1; --good:#17b67c; --warn:#f0b429; --bad:#e35a5a; --pill:#1a2232; --pill-border:#2a3954; --btn:#1a2334; --btn-border:#2a3954; --btn-hover:#21304a; --stroke:#162033; --btn-verde:#15b97c; --btn-vermelho:#e35a5a; --btn-azul:#3c82f6; --btn-roxo:#814af9; --btn-amarelo:#ffe96c; --btn-cinza:#b7bfc9; --btn-branco:#fff; --btn-txt-dark:#19202c; }
    *{box-sizing:border-box} html,body{height:100%}
    body{
      margin:0;
      background:linear-gradient(180deg,#0b1120 0%, #0d1527 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
    }
    header{
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      padding: 8px 22px;
      background: rgba(3,8,20,.85);
      backdrop-filter: blur(6px);
      min-height: 38px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .toolbar-sticky {
      position: fixed;
      top: 46px; /* altura real do header (ajuste se mudar padding) */
      left: 0;
      width: 100%;
      z-index: 45;
      background: #0e1420;
      border-bottom: 1px solid var(--stroke);
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 38px;
      padding: 0 22px;
      justify-content: flex-start;
    }
    .toolbar-sticky button,
    .toolbar-sticky .btn,
    .toolbar-sticky .add-btn {
      margin: 0;
      font-size: 13px;
      padding: 7px 12px !important;
      height: 30px;
      min-width: 0;
    }
    .toolbar-sticky .filters {
      margin-left: 18px;
      gap: 6px;
    }
    .brand{
      display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:.2px; font-size:18px;
    }
    .brand .logo{
      width:26px; height:26px; border-radius:6px;
      background:linear-gradient(135deg,#3c82f6,#1f6be1);
      display:inline-block;
      box-shadow:0 0 0 2px rgba(60,130,246,.25);
    }
    .metrics{display:flex; gap:10px; align-items:center; flex-wrap:nowrap}
    .metric{
      display:flex; align-items:center; gap:8px;
      padding:6px 10px; border:1px solid var(--pill-border);
      border-radius:8px; background:var(--pill); font-size:12px; color:var(--muted)
    }
    .metric b{color:var(--text); font-size:13px}
    .metric.clickable { cursor: pointer; }
    .metric.clickable:hover { filter: brightness(1.07); }
    .wrap{ max-width:1100px; margin:0 auto; padding:0 16px; padding-top:110px; }
    /* Toolbar refinada: ações à direita, quebra suave */
    .toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px }
    .toolbar .actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto }
    /* Ponto de notificação no botão "Arquivo" quando existir issues */
    .notif-dot{
      display:inline-block; width:8px; height:8px; border-radius:50%;
      background: var(--bad);
      margin-left:6px;
      box-shadow: 0 0 0 2px var(--btn); /* borda para destacar no botão */
    }

    .add-btn{
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff; border:none; border-radius:8px; padding:10px 14px;
      font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(31,107,225,.25);
      transition:.15s;
    }
    .add-btn:hover{
      transform: translateY(-1px);
      box-shadow:0 8px 22px rgba(31,107,225,.35);
    }
    .list{display:flex; flex-direction:column; gap:12px}

    .perfil{
      border:1px solid var(--border); background:linear-gradient(180deg, var(--card), var(--card2));
      border-radius:12px; padding:12px; display:grid; grid-template-columns: 220px 1fr 340px; gap:12px;
      box-shadow:0 1px 0 0 rgba(255,255,255,.03) inset;
      transition: background 0.2s, border 0.2s, opacity 0.15s;
    }
    .perfil.frozen {
      opacity: 0.66;
      filter: grayscale(0.35);
      pointer-events: none;
      background:linear-gradient(180deg, #19202c 60%, var(--card2));
      border-color: #434d5b;
    }
    .leftCol{
      display:flex; align-items:center; gap:10px;
      padding-right:10px; border-right:1px dashed var(--stroke);
    }
    .toggle{
      border:1px solid var(--btn-border); background:var(--btn); color:var(--text);
      border-radius:9px; padding:8px 12px; font-weight:700; cursor:pointer; transition:.12s;
    }
    .toggle.open{ border-color:#24562b; background:rgba(23,182,124,.12); color:#c6f3e3; }
    .toggle.close{ border-color:#4b2a2a; background:rgba(227,90,90,.12); color:#ffdede; }
    .toggle:hover{ filter:brightness(1.06) }

    .centerCol{ display:flex; flex-direction:column; gap:6px; }
    .titleRow{ display:flex; align-items:center; gap:10px; flex-wrap:wrap }
    .accName{ font-weight:800; letter-spacing:.2px }
    .pill{
      border:1px solid var(--pill-border); background:var(--pill); color:var(--muted);
      font-size:11px; padding:3px 8px; border-radius:999px; display:inline-flex; gap:6px; align-items:center;
    }
    .pill .dot{ width:8px; height:8px; border-radius:999px; background:#888 }
    .pill.good .dot{ background:var(--good) }
    .pill.warn .dot{ background:var(--warn) }
    .pill.bad  .dot{ background:var(--bad)  }
    .pill.info .dot{ background:var(--brand) }
    .pill.ramWarn   { border-color: #cf8a2e; background: #31210e; color: #f6cc87; }
    .pill.ramBad    { border-color: #e35a5a; background: #360f0f; color: #f1b3b3; font-weight:700; }
    .pill.frozen    { border-color:#BBB; background:#272f3c; color:#fff; font-weight:700;}
    .pill.cooldown  { border-color: #dba125; background: #2d230a; color: #f2d289;}
    .pill.abas      { border-color: #b28ef1; background: #1c183a; color: #cbbaff;}
    .subRow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:12px }

    .rightCol{ display:flex; align-items:center; gap:8px; justify-content:flex-end; flex-wrap:wrap }
    .btn{
      border:1px solid var(--btn-border); background:var(--btn); color:var(--text);
      border-radius:9px; padding:8px 10px; font-size:12px; cursor:pointer; transition:.12s; font-weight:700;
    }
    .btn:hover{ background:var(--btn-hover) }
    .btn.primary{ background:linear-gradient(135deg, var(--brand), var(--brand2)); border:0; color:#fff }
    .btn.danger { border-color:#5c2b2b; background:rgba(227,90,90,.12); color:#ffdede }
    .btn.reset-memmil {
      border-color: #cf8a2e;
      background: linear-gradient(90deg, #fbcb6c 0%, #d49a34 100%);
      color:#442d09;
      font-weight: 800;
      box-shadow:0 1px 7px #a4791e12;
      letter-spacing:0.1px;
    }
    .btn.reset-memmil:disabled { opacity:.55; filter: saturate(0.7); cursor:not-allowed;}
    .icon-btn{
      border:1px solid var(--btn-border); background:var(--btn); color:#cfe1ff;
      border-radius:9px; padding:7px 9px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    }
    .icon-btn:hover{ background:var(--btn-hover) }
    .icon{ width:15px; height:15px; display:inline-block }

    /* Spinner para botões em estado de carregamento */
    .spinner{
      width:14px; height:14px;
      border:2px solid rgba(255,255,255,.25);
      border-top-color:#fff;
      border-radius:50%;
      display:inline-block;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{ to { transform: rotate(360deg); } }
    .loading{ opacity:.85; pointer-events:none }

    /* Botão pequenino para caber ao lado das pills */
    .icon-btn.mini{
      padding:4px 6px; font-size:11px;
    }
    .icon-btn.mini .icon{ width:12px; height:12px }

    /* Modal base */
    .modal-ov{ position: fixed; inset:0; background: rgba(0,0,0,.46); display:flex; align-items:center; justify-content:center; z-index:9999; }
    .modal-box{ background:#0f1625; color:var(--text); border:1px solid var(--border); border-radius:12px; max-width:560px; width:92%; padding:18px 18px 16px; box-shadow:0 16px 50px rgba(0,0,0,.45); }
    .modal-box h2{ margin:6px 0 14px; font-size:18px }
    .form-row{ margin-bottom:12px }
    label{ display:block; margin-bottom:6px; color:#cdd9f0; font-weight:600; font-size:13px }
    input[type="text"], textarea, select{
      width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:#0a1322; color:var(--text);
    }
    .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:14px }
    .danger-zone{
      margin-top:14px; padding:10px; border:1px solid #432; background:rgba(227,90,90,.08); border-radius:8px;
    }
    .filters{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px }
    .filters .btn.active{ background:linear-gradient(135deg, var(--brand), var(--brand2)); border:0; color:#fff }

    .btn-verde    { background: var(--btn-verde) !important; color: #fff !important; font-weight: 800; }
    .btn-vermelho { background: var(--btn-vermelho) !important; color: #fff !important; font-weight: 800; }
    .btn-azul     { background: var(--btn-azul) !important; color: #fff !important; font-weight: 800; }
    .btn-roxo     { background: var(--btn-roxo) !important; color: var(--btn-txt-dark) !important; font-weight: 800; }
    .btn-amarelo  { background: var(--btn-amarelo) !important; color: var(--btn-txt-dark) !important; font-weight: 800; }
    .btn-cinza    { background: var(--btn-cinza) !important; color: var(--btn-txt-dark) !important; font-weight: 800; }
    .btn-branco   { background: var(--btn-branco) !important; color: var(--btn-txt-dark) !important; font-weight: 800; }

    /* === BUSCA — estilos coesos com toolbar === */
    .search-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 12px;
    }
    .search-input {
      height: 30px;
      padding: 6px 10px;
      border: 1px solid var(--btn-border);
      background: var(--btn);
      color: var(--text);
      border-radius: 8px;
      font-size: 13px;
      width: 260px;
      outline: none;
    }
    .search-input::placeholder {
      color: var(--muted);
    }
    .search-clear {
      height: 30px;
      padding: 6px 10px;
      border: 1px solid var(--btn-border);
      background: var(--btn);
      color: var(--text);
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .search-clear:hover { background: var(--btn-hover); }
    /* Mensagem de “nenhum resultado para a busca” */
    .no-results {
      margin: 10px 0;
      padding: 10px 12px;
      border: 1px dashed var(--pill-border);
      border-radius: 8px;
      background: #0b1322;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo"></span>
      <div>
        <div style="line-height:1.05"><span>Conveniente</span><br><span style="font-weight:400">Tecnologia</span></div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric"><span>Total</span><b id="mTotal">0</b></div>
      <div class="metric"><span>Ativos</span><b id="mAtivos">0</b></div>
      <div class="metric"><span>Trabalhando</span><b id="mTrabalhando">0</b></div>
      <div class="metric"><span>Fila</span><b id="mFila">0</b></div>
      <div class="metric"><span>RAM</span><b id="mRam">--</b></div>
      <div class="metric"><span>CPU</span><b id="mCpu">--</b></div>
      <div class="metric"><span>Fotos</span><b id="mFotos">0</b></div>
      <div class="metric clickable" id="metricLogin" style="display:none"><span>Login requerido</span><b id="mLoginReq">0</b></div>
      <div class="metric clickable" id="metricBanned" style="display:none"><span>Banidas</span><b id="mBanidas">0</b></div>
      <div class="metric"><span>Modo</span><b id="mModo">--</b></div>
      <div class="metric" id="mRamPanel" style="display:none"><span>RAM total:</span><b id="mRamTotal">--</b> <span>| RAM máx:</span> <b id="mRamMax">--</b> <span>| Perfis c/ RAM alta:</span> <b id="mRamMilit">0</b> <span>| Cooldown:</span> <b id="mPCooldown">0</b> <span>| Congelados:</span> <b id="mPFrozen">0</b></div>
    </div>
  </header>

  <div class="toolbar toolbar-sticky">
    <button class="add-btn" id="addPerfilBtn">+Nova Conta</button>
    <button class="btn" id="citiesCountBtn">Cidades</button>
    <button class="btn btn-roxo" id="startAllBtn">Abrir Todos 24h</button>
    <button class="btn btn-vermelho" id="stopAllBtn">Fechar Todos</button>
    <button class="btn btn-amarelo" id="invokeAllBtn">Invocar Tudo</button>
    <button class="btn btn-verde" id="resumeAllBtn">Retomar Tudo</button>
    <button class="btn btn-azul" id="robe24AllBtn">Robe 24h</button>
    <button class="btn btn-branco" id="robeReleaseAllBtn">Liberar Robe</button>
    <button class="btn btn-cinza" id="unfreezeAllBtn">Descongelar</button>

    <!-- >>> BUSCA: imediatamente antes dos filtros <<< -->
    <div class="search-group">
      <input id="searchInput" class="search-input" type="text" placeholder="Pesquisar contas" autocomplete="off" />
      <button id="searchClear" class="search-clear" type="button">Limpar</button>
    </div>

    <div class="filters" style="display:inline-flex;gap:6px;margin-left:10px">
      <button class="btn" id="filterAll">Todas</button>
      <button class="btn" id="filterActive">Ativas</button>
      <button class="btn" id="filterInactive">Inativas</button>
      <button class="btn" id="filterIssues">Com problema</button>
    </div>
  </div>

  <div class="wrap">
    <div id="listaPerfis" class="list"></div>
  </div>
  <script src="app.js"></script>
  <script>
    // Lock para impedir múltiplos comandos em massa simultâneos — fortalece UX com fluxo único!
    let startAllLock = false;
    let stopAllLock  = false;
    // Quando um comando remoto (via notificador) dispara "close_all", o lock precisa refletir aqui também.
    let stopAllRemoteLock = false;
    let massMiscLock = false; // Novo lock para ações de massa diversas (invoke/resume)
    function isMassActionRunning(){ return startAllLock || stopAllLock || massMiscLock; }
    function alertMassActionRunning(msg){
      alert(msg || 'Outra ação em massa já está em andamento. Aguarde finalizar.');
    }
    function setGlobalActionButtonsDisabled(disable, { exclude = [] } = {}) {
      const ids = ['startAllBtn','stopAllBtn','robe24AllBtn','robeReleaseAllBtn','unfreezeAllBtn','citiesCountBtn','invokeAllBtn','resumeAllBtn'];
      ids.forEach(id => {
        if (exclude.includes(id)) return;
        const el = document.getElementById(id);
        if (!el) return;
        el.disabled = !!disable;
        el.style.opacity = disable ? '0.7' : '';
        el.style.cursor = disable ? 'not-allowed' : '';
      });
    }

    // Util: tempo restante
    function tempoRestante(seg) {
      if (seg <= 0) return 'Pronto!';
      const h = Math.floor(seg/3600), m = Math.floor((seg%3600)/60), s = seg % 60;
      if (h) return `${h}h ${m}m ${s}s`;
      if (m) return `${m}m ${s}s`;
      return `${s}s`;
    }

    // ====== ENTERPRISE: estado final único por conta (mutuamente exclusivo) ======
    function classifyAccountFinal(p, robes) {
      try {
        p = (p && typeof p === 'object') ? p : {};
        const r = (robes && p.nome && robes[p.nome]) ? robes[p.nome] : null;

        // 0) Falha de login_remediate (blindagem anti-loop): precisa aparecer MUITO claro no painel
        if (p.loginRemediateFailed === true && p.banned !== true) {
          const rr = String(p.loginRemediateFailedReason || 'login_remediate_failed').trim();
          const x = rr.toLowerCase();
          const isUi = x.startsWith('ui_blocked:');
          const is2fa = (x.includes('two_factor') || x.includes('2fa') || x.includes('two factor'));
          return {
            kind: 'login_failed',
            label: isUi ? 'UI bloqueada (Humano)' : (is2fa ? '2FA (Humano)' : 'Login/Cookies falhou (Humano)'),
            cls: 'bad',
            title: rr ? `Falha automática (anti-loop). Motivo: ${rr}.` : 'Falha automática (anti-loop).'
          };
        }

        // 1) Banida vence tudo
        if (p.banned === true) {
          return { kind: 'banned', label: 'Conta suspensa', cls: 'bad', title: (p.bannedText || 'Suspensão/désativação detectada') };
        }

        // 1.5) Recurso/Apelação submetida (monitoramento a cada 1h)
        if (p.appealSubmitted === true) {
          const nextAt = Number(p.appealNextCheckAt || 0) || 0;
          const remainSec = nextAt ? Math.max(0, Math.ceil((nextAt - Date.now()) / 1000)) : 0;
          const extra = nextAt ? ` (${tempoRestante(remainSec)})` : ' (aguardando)';
          const lr = String(p.appealLastReason || '').trim();
          return {
            kind: 'appeal_pending',
            label: 'Recurso em análise' + extra,
            cls: 'warn',
            title: lr ? `Último status detectado: ${lr}.` : 'Recurso em análise. O sistema fará reload e recheck quando o timer zerar.'
          };
        }

        // 2) LoginRequired é guarda-chuva; loginReason define o subtipo final
        if (p.loginRequired === true) {
          const rr = String(p.loginReason || '').trim();
          const x = rr.toLowerCase();
          if (x.includes('captcha') || x.includes('checkpoint')) return { kind: 'captcha', label: 'Captcha/Checkpoint', cls: 'bad', title: rr || 'Confirme que é humano' };
          if (x === 'login_form') return { kind: 'login', label: 'Login necessário', cls: 'warn', title: rr };
          if (x.includes('session')) return { kind: 'session', label: 'Sessão expirada', cls: 'warn', title: rr };
          if (x.includes('2fa') || x.includes('two_factor')) return { kind: 'two_factor', label: '2FA', cls: 'warn', title: rr };
          if (x.includes('identity')) return { kind: 'identity', label: 'Identidade', cls: 'bad', title: rr };
          if (x.includes('consent')) return { kind: 'consent', label: 'Consentimento', cls: 'warn', title: rr };
          return { kind: 'unknown', label: 'Login requerido', cls: 'warn', title: rr || 'Sessão/Checkpoint/Captcha detectado' };
        }

        // 3) Limite excedido vem do Robe (pauseReason/estado)
        const robeEstado = String((r && r.estado) || '').trim().toLowerCase();
        const pauseReason = String((r && r.pauseReason) || '').trim().toLowerCase();
        if (robeEstado === 'paused_limit' || pauseReason === 'limit_posting') {
          const cd = Number(r && r.cooldownSec || 0) || 0;
          const extra = cd > 0 ? ` (${tempoRestante(cd)})` : '';
          return { kind: 'limit_exceeded', label: 'Limite excedido' + extra, cls: 'warn', title: 'Conta nova/limite de postagem. Aguarde ou use PLAY quando liberar.' };
        }

        return { kind: 'ok', label: 'OK', cls: 'good', title: '' };
      } catch {
        return { kind: 'unknown', label: 'Desconhecido', cls: 'warn', title: '' };
      }
    }

    // Tipos de ERRO considerados no log (Virtus/Robe)
    const ERROR_TYPES = new Set([
      // Robe/Virtus e falhas macro
      'robe_error','robe_no_photo','virtus_blocked','virtus_no_composer','virtus_send_failed',
      'browser_disconnected','virtus_page_dead','chrome_memory_spike','cpu_memory_spike','cookie_inject_failed','mil_action',
      // Admin/macros
      'admin_activate_request','admin_deactivate_request','admin_configure_request','admin_start_work_request','admin_invoke_human_request','admin_robe_play_request','admin_robe24h_request','admin_human_resume_request','admin_rename_label','admin_rename_slug','admin_delete_perfil','admin_unfreeze','admin_unfreeze_all',
      // Freezer e macro-transições adicionais
      'robe_frozen','robe_unfrozen','profile_frozen','profile_unfrozen','auto_freeze','auto_unfreeze','robe_backoff','robe_paused','robe_resumed'
    ]);
    function isErrorIssue(it) {
      try { return ERROR_TYPES.has(String(it && it.type || '')); } catch { return false; }
    }

    // MODAL: criar conta (com loading + mensagens no próprio modal)
    function showCriarContaModal({ cidades }) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-ov';
      const box = document.createElement('div');
      box.className = 'modal-box';
      box.innerHTML = `
        <h2>Nova Conta</h2>
        <div class="form-row">
          <label>Cidade</label>
          <select id="cidadeSel"></select>
        </div>
        <div class="form-row">
          <label>Categoria</label>
          <select id="categoriaSel">
            <option value="fretes" selected>Fretes</option>
            <option value="veiculos">Veículos</option>
          </select>
          <div class="pill" style="margin-top:8px; opacity:.9">
            <span class="dot"></span>
            <span>Define o modo do Robe (itens vs veículos) na criação.</span>
          </div>
        </div>
        <div class="form-row">
          <label>Conta do Estoque (CT)</label>
          <select id="stockAccSel"></select>
          <div class="pill info" style="margin-top:8px">
            <span class="dot"></span>
            <span>Criação manual agora é <b>somente via Estoque</b> (sem campo de cookies).</span>
          </div>
        </div>
        <div id="criarContaMsg" style="display:none" class="pill"></div>
        <div class="modal-actions">
          <button class="btn" id="cancelarBtn" type="button">Cancelar</button>
          <button class="btn primary" id="confirmarBtn" type="button">Criar Conta</button>
        </div>
      `;
      overlay.append(box);
      document.body.append(overlay);

      const sel = box.querySelector('#cidadeSel');
      const catSel = box.querySelector('#categoriaSel');
      sel.innerHTML = `<option value="">Selecione uma cidade</option>`;
      (cidades||[]).forEach(c => {
        const opt = document.createElement('option');
        opt.value = typeof c === 'string' ? c : (c.nome || c.label || c.id || '');
        opt.textContent = typeof c === 'string' ? c : (c.nome || c.label || c.id || '');
        sel.append(opt);
      });

    function buildPill(text, cls='info'){ const span=document.createElement('span'); span.className='pill '+cls; span.innerHTML=`<span class="dot"></span>${text}`; return span; }

    // === BUSCA — Estado e helpers (blindado) ===
    const UI_SEARCH_STORAGE_KEY = 'admin_search_query_v1';
    const uiSearch = {
      query: '',
      tokens: [],
      inputEl: null,
      clearEl: null,
      debounce: null
    };

    let lastPerfisCache = [];          // cache do dataset “total”
    let lastRobesCache = {};           // cache do status de Robe
    let lastRobeQueueCache = [];       // cache da fila
    let lastSearchIndexCache = new Map(); // nome -> texto normalizado para busca

    function normalizeText(s) {
      return String(s || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }
    function computeTokens(q) {
      const t = normalizeText(q).trim().split(/\s+/).filter(Boolean);
      return t;
    }
    // Constrói índice de busca do perfil usando campos relevantes
    function buildSearchIndex(perfis, robes) {
      const m = new Map();
      for (const p of perfis) {
        const robe = robes && robes[p.nome] || {};
        const fields = [
          p.nome || '',
          p.label || '',
          p.cidade || '',
          p.manifestStatus || '',
          p.closingReason || '',
          p.loginRequired ? 'login requerido' : '',
          p.banned ? 'banida suspensa' : '',
          robe.estado || '',
          robe.pauseReason || '',
          (p.loginReason || ''),
          (p.bannedText || ''),
          (p.whyNotOpen || '')
        ];
        m.set(p.nome, normalizeText(fields.join(' ')));
      }
      return m;
    }
    // Predicado da BUSCA — aplica sobre tokens normalizados
    function passSearch(p) {
      if (!uiSearch.tokens.length) return true;
      const s = lastSearchIndexCache.get(p.nome) || '';
      // todos os tokens devem ocorrer
      for (const tok of uiSearch.tokens) {
        if (!s.includes(tok)) return false;
      }
      return true;
    }
    function setSearchQuery(newQ, { persist = true, rerender = true } = {}) {
      const q = String(newQ || '');
      uiSearch.query = q;
      uiSearch.tokens = computeTokens(q);
      if (persist) {
        try { localStorage.setItem(UI_SEARCH_STORAGE_KEY, q); } catch {}
      }
      if (rerender) renderListFromCache();
    }
    function bindSearchUI() {
      uiSearch.inputEl = document.getElementById('searchInput');
      uiSearch.clearEl = document.getElementById('searchClear');

      // inicializa de localStorage
      let q = '';
      try { q = localStorage.getItem(UI_SEARCH_STORAGE_KEY) || ''; } catch {}
      if (uiSearch.inputEl) uiSearch.inputEl.value = q;
      setSearchQuery(q, { persist: false, rerender: false });

      const onInput = () => {
        clearTimeout(uiSearch.debounce);
        uiSearch.debounce = setTimeout(() => {
          setSearchQuery(uiSearch.inputEl.value, { persist: true, rerender: true });
        }, 120);
      };
      uiSearch.inputEl && uiSearch.inputEl.addEventListener('input', onInput);

      // ESC para limpar
      uiSearch.inputEl && uiSearch.inputEl.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape') {
          uiSearch.inputEl.value = '';
          setSearchQuery('', { persist: true, rerender: true });
          uiSearch.inputEl.focus();
        }
      });
      // Ctrl+K para focar
      document.addEventListener('keydown', (ev) => {
        if ((ev.ctrlKey || ev.metaKey) && (ev.key.toLowerCase() === 'k')) {
          ev.preventDefault();
          uiSearch.inputEl && uiSearch.inputEl.focus();
          uiSearch.inputEl && uiSearch.inputEl.select && uiSearch.inputEl.select();
        }
      });
      // botão limpar
      uiSearch.clearEl && uiSearch.clearEl.addEventListener('click', () => {
        if (uiSearch.inputEl) uiSearch.inputEl.value = '';
        setSearchQuery('', { persist: true, rerender: true });
        uiSearch.inputEl && uiSearch.inputEl.focus();
      });
    }

    // ============================= INÍCIO ALTERAÇÕES PEDIDAS =============================
    // Militar: null-aware, badge neutra se RAM/CPU desconhecida
    // Helper pill RAM
    function buildRamPill(ramMB) {
      // Militar: null-aware RAM/CPU badge. Nunca badge "0" se null
      if (ramMB === null || ramMB === undefined) { // Null ou undefined: badge neutra
        return buildPill('RAM: —', 'info');
      }
      // até <500: normal, entre 500-700: warn (amarelo), >700MB: alerta vermelho pill
      let cls = '';
      let label = `RAM: ${ramMB} MB`;
      if (ramMB >= 700) cls = 'ramBad';
      else if (ramMB >= 500) cls = 'ramWarn';
      return buildPill(label, cls || 'info');
    }

    // Militar: null-aware, badge neutra se RAM/CPU desconhecida
    // Helper pill CPU (instrução adicionada)
    function buildCpuPill(cpuPercent) {
      // Militar: null-aware RAM/CPU badge. Nunca badge "0" se null
      if (cpuPercent === null || cpuPercent === undefined) {
        return buildPill('CPU: —', 'info');
      }
      let cls = '';
      let label = `CPU: ${cpuPercent}%`;
      if (cpuPercent >= 150) cls = 'ramBad';
      else if (cpuPercent >= 80) cls = 'ramWarn';
      return buildPill(label, cls || 'info');

    // Helper badge Frozen/skip/antiflood (roboFrozenUntil > Date.now())
    // Militar: frozenUntil/COOLDOWN badge lógica
    function buildFrozenPill(p) {
      if (!p || !p.robeFrozenUntil) return null;
      try {
        const ts = Number(p.robeFrozenUntil);
        if (!ts || ts < Date.now()) return null;
        const agora = Date.now();
        the_restante = Math.max(0, Math.floor((ts-agora)/1000));
        const reason = p.frozenReason ? String(p.frozenReason) : 'motivo não informado';
        const sinceStr = p.frozenAt ? new Date(p.frozenAt).toLocaleString() : '';
        const span = buildPill(`ROBE Congelado (${tempoRestante(the_restante)})`, 'frozen');
        span.title = `Motivo: ${reason}\nDesde: ${sinceStr}`;
        return span;
      } catch { return null; }
    }

    // Helper: activationHeldUntil pill
    function buildActivationHeldPill(p) {
      if (!p || !p.activationHeldUntil) return null;
      try {
        const ts = Number(p.activationHeldUntil);
        if (!ts || ts < Date.now()) return null;
        const restante = Math.max(0, Math.floor((ts - Date.now())/1000));
        return buildPill(`Ativação em espera (${tempoRestante(restante)})`, 'warn');
      } catch { return null; }
    }

    function buildReopenAtPill(p) {
      if (!p || !p.reopenAt) return null;
      try {
        const ts = Number(p.reopenAt);
        if (!ts || ts < Date.now()) return null;
        const restante = Math.max(0, Math.floor((ts - Date.now())/1000));

    // Helper estado do robe
    function buildRobeEstadoPill(robeEstado) {
      robeEstado = (robeEstado||'').toLowerCase();
      // Highligh: erro/anormal/backoff = vermelho, skip/pausa=amarelo, ok/em fila/normal = verde/info
      let cls='info';
      let txt = robeEstado.replace(/^./, c=>c.toUpperCase());
      if (/erro|grave|fail|backoff/.test(robeEstado)) cls='bad';
      else if (/skip|congel|frozen|pausa|warn/.test(robeEstado)) cls='warn';
      else if (/ok|normal|pronto/.test(robeEstado)) cls='good';
      else if (/fila/.test(robeEstado)) cls='info';
      return buildPill(`Robe: ${txt}`, cls);
    }

    async function safeListPerfis() {
      try {
        if (window.electronAPI && typeof window.electronAPI.listPerfis === 'function') {
          return await window.electronAPI.listPerfis().catch(() => null);
        }
      } catch {}
      return await fetch('/api/perfis').then(r => r.json()).catch(() => null);
    }

    // ----------- ENUMERAÇÃO DAS CONTAS (perfis.forEach ao invés do loop original) -------------
    async function reloadPerfis() {
      const [st, perfisResp] = await Promise.all([
        safeGetStatus(),
        safeListPerfis()
      ]);

      // ====== NOVO: sincronizar ações em massa vindas do backend (comandos remotos) ======
      try {
        const op = st && st.ops && st.ops.close_all ? st.ops.close_all : null;
        const stopBtn = document.getElementById('stopAllBtn');
        if (op && op.running) {
          stopAllRemoteLock = true;
          stopAllLock = true; // trava UX enquanto fecha
          setGlobalActionButtonsDisabled(true);
          if (stopBtn) {
            const done = Number(op.done || 0) || 0;
            const total = Number(op.total || 0) || 0;
            stopBtn.disabled = true;
            stopBtn.style.opacity = '0.7';
            stopBtn.style.cursor = 'not-allowed';
            stopBtn.textContent = total > 0 ? `Fechando... ${done}/${total}` : 'Fechando...';
            stopBtn.title = op.current ? ('Agora: ' + String(op.current)) : '';
          }
        } else if (stopAllRemoteLock) {
          // Só destrava automaticamente se este lock foi "remoto".
          stopAllRemoteLock = false;
          stopAllLock = false;
          if (stopBtn) {
            stopBtn.disabled = false;
            stopBtn.style.opacity = '';
            stopBtn.style.cursor = '';
            stopBtn.textContent = 'Fechar Todos';
            stopBtn.title = '';
          }
          setGlobalActionButtonsDisabled(false);
        }
      } catch {}
      const basePerfis = Array.isArray(perfisResp?.perfis) ? perfisResp.perfis : [];
      const perfisMap = new Map(basePerfis.map(p => [p.nome, Object.assign({
        active: false, trabalhando: false, configurando: false, humanControl: false, issuesCount: 0,
        ramMB: null, cpuPercent: null, numPages: null,
        robeFrozenUntil: null, frozenReason: null, frozenAt: null, frozenSetBy: null,
        activationHeldUntil: null, reopenAt: null, openBackoffMs: null, lastSwapAt: null, swapCooldown: null, whyNotOpen: null,
        manifestStatus: null, closingReason: null
      }, p)]));
      // Overlay de /api/status (st)
      if (Array.isArray(st?.perfis)) {
        st.perfis.forEach(o => {
          const dst = perfisMap.get(o.nome);
          if (dst) Object.assign(dst, o);
        });
      }
      const perfis = Array.from(perfisMap.values());
      const robes  = st?.robes || {};
      const robeQueue = st?.robeQueue || [];

      // Banner global de aviso (warning) caso backend informe
      const warn = st && st.warning;
      if (warn) {
        let b = document.getElementById('globalWarn');
        if (!b) {
          b = document.createElement('div');
          b.id = 'globalWarn';
          b.style.cssText = 'margin:10px 0;padding:8px;border:1px solid #a66;background:#3a2222;color:#ffdede;border-radius:8px';
          b.innerText = 'Aviso: ' + warn;
          const wrapEl = document.querySelector('.wrap');
          const listEl = document.getElementById('listaPerfis');
          if (wrapEl && listEl) {
            wrapEl.insertBefore(b, listEl);
          }
        } else b.innerText = 'Aviso: ' + warn;
      } else {
        const b = document.getElementById('globalWarn');
        if (b) b.remove();
      }

      // ----- ALTERAÇÃO: GLOBAL HEALTH PANEL ------
      // Militar: somar apenas perfis com RAM !== null
      let ramTotal = 0, ramMilit = 0, ramMax = 0, pCooldown = 0, pFrozen = 0, gordoCount = 0;
      for (const p of perfis) {
        if (typeof p.ramMB === 'number') {
          ramTotal += p.ramMB;
          if (p.ramMB >= 700) ramMilit++;
          if (p.ramMB > ramMax) ramMax = p.ramMB;
          if (p.ramMB >= 600) gordoCount++;
        }
        if (p.robeFrozenUntil && p.robeFrozenUntil > Date.now()) pFrozen++;
        const robeStatus = robes[p.nome] || {};
        if (robeStatus.cooldownSec > 0) pCooldown++;
      }
      // RAM painels
      if (perfis.length) {
        document.getElementById('mRamPanel').style.display = 'flex';
        document.getElementById('mRamTotal').textContent = (ramTotal ? `${ramTotal} MB` : '--');
        document.getElementById('mRamMax').textContent = (ramMax ? `${ramMax} MB` : '--');
        document.getElementById('mRamMilit').textContent = ramMilit;
        document.getElementById('mPCooldown').textContent = pCooldown;
        document.getElementById('mPFrozen').textContent = pFrozen;
      } else {
        document.getElementById('mRamPanel').style.display = 'none';
      }
      // Métrica Perfis >600MB (Gordos) — removida da interface; manter sem efeito visual
      const gordEl = document.getElementById('mGordos');
      if (gordEl) gordEl.textContent = String(gordoCount);

      // Militar: badge de modo full/leve, tooltip detalhado do autoMode/state
      const auto = st && st.autoMode || null;
      const modoEl = document.getElementById('mModo');
      if (modoEl) {
        if (auto && auto.mode === 'light') {
          modoEl.textContent = 'Leve';
          modoEl.style.color = '#f6cc87';
          modoEl.parentElement.title = `Leve: ${auto.reason || ''} | desde: ${auto.since ? new Date(auto.since).toLocaleTimeString() : ''} | CPU EMA: ${Math.round((auto.cpuEma||0))}% | RAM EMA: ${Math.round((auto.freeEmaMB||0))} MB`;
        } else if (auto && auto.mode === 'full') {
          modoEl.textContent = 'Full';
          modoEl.style.color = '#c6f3e3';
          modoEl.parentElement.title = `Full | CPU EMA: ${Math.round((auto.cpuEma||0))}% | RAM EMA: ${Math.round((auto.freeEmaMB||0))} MB`;
        } else {
          modoEl.textContent = '--';
          modoEl.style.color = '';
          modoEl.parentElement.title = '';
        }
      }

      // Metrics
      document.getElementById('mTotal').textContent = String(perfis.length);
      document.getElementById('mAtivos').textContent = String(perfis.filter(p => p.active).length);
      document.getElementById('mTrabalhando').textContent = String(perfis.filter(p => p.trabalhando).length);
      document.getElementById('mFila').textContent = String(robeQueue.length);

      // Contagens agregadas
      // Login requerido (AGREGADO): soma de subtipos do guarda-chuva loginRequired (captcha/login/session/2fa/identity/consent/unknown)
      let loginCount = 0;
      let bannedCount = 0;
      for (const p of perfis) {
        const st = classifyAccountFinal(p, robes);
        if (st.kind === 'banned') bannedCount++;
        else if (['captcha','login','session','two_factor','identity','consent','unknown'].includes(st.kind)) loginCount++;
      }

      // Atualiza cards do header
      const loginCard = document.getElementById('metricLogin');
      const banCard   = document.getElementById('metricBanned');
      const mLogin    = document.getElementById('mLoginReq');
      const mBan      = document.getElementById('mBanidas');

      if (mLogin) mLogin.textContent = String(loginCount);
      if (mBan)   mBan.textContent   = String(bannedCount);

      if (loginCard) loginCard.style.display = loginCount > 0 ? 'inline-flex' : 'none';
      if (banCard)   banCard.style.display   = bannedCount > 0 ? 'inline-flex' : 'none';

      // No final da reloadPerfis, sempre faça:
      lastPerfisCache = perfis;
      lastRobesCache = robes;
      lastRobeQueueCache = robeQueue;
      lastSearchIndexCache = buildSearchIndex(lastPerfisCache, lastRobesCache);
      buildList(lastPerfisCache, lastRobesCache, lastRobeQueueCache);
    }

    function buildList(perfisInput, robes, robeQueue) {
      const lista = document.getElementById('listaPerfis');
      lista.innerHTML = '';

      if (!perfisInput.length) {
        const empty = document.createElement('div');
        empty.className='pill';
        empty.textContent='Nenhuma conta cadastrada.';
        lista.appendChild(empty);
        return;
      }

      const filtered = perfisInput.filter(passFilter);
      if (!filtered.length) {
        const no = document.createElement('div');
        no.className = 'no-results';
        const q = uiSearch.query ? ` para “${uiSearch.query}”` : '';
        no.textContent = `Nenhuma conta encontrada${q}.`;
        lista.appendChild(no);
        return;
      }

      // Render com fragment para reduzir reflow
      const frag = document.createDocumentFragment();
      filtered.forEach((p, idx) => {
        const robeStatus = robes[p.nome] || {};
        const robeCooldownSec = robeStatus.cooldownSec || 0;
        const fila = robeQueue || [];
        const inQueue = fila.includes(p.nome);
        const isNext = (fila[0] === p.nome);
        const display = p.label || p.nome;
        const idxStr = String(idx + 1).padStart(3, '0'); // 001, 002, ...

        const card = document.createElement('div');
        card.className='perfil';

        // ----- BLOQUEIO/CONGELAMENTO: antiflood skip/frozen ----
        const isFrozen = (p.robeFrozenUntil && p.robeFrozenUntil > Date.now());
        if (isFrozen) card.classList.add('frozen');

        // -- NOVO: Ativação em espera e Reabrirá em --
        const activationHeldPill = buildActivationHeldPill(p);
        const reopenAtPill = buildReopenAtPill(p);

        // LEFT: toggle
        const left = document.createElement('div'); left.className='leftCol';
        const toggle = document.createElement('button');
        toggle.className = 'toggle ' + (p.active ? 'close btn-vermelho':'open btn-verde');
        toggle.textContent = p.active ? 'Fechar navegador' : 'Abrir navegador';
        toggle.onclick = () => toggleBrowserUI(p, toggle);
        if (isFrozen) toggle.disabled = true;
        if (activationHeldPill) {
          toggle.disabled = true;
          toggle.title = 'Ativação em espera pelo sistema militar RAM/CPU';
        }
        left.append(toggle);

        // NOVO: start 24h logo abaixo do toggle (com loading)
        const btnStartLeft = document.createElement('button');
        btnStartLeft.className = 'btn btn-roxo';
        btnStartLeft.textContent = 'Iniciar Atendimento e Postagem 24Hrs';
        btnStartLeft.onclick = (ev) => startWorkUI(p, btnStartLeft);
        if (isFrozen) btnStartLeft.disabled = true;
        left.append(btnStartLeft);

        // ------------------- RAM VISUAL (ADICIONADO) -------------------
        // Militar: null-aware, badge neutra se RAM/CPU desconhecida
        // RAM por conta (campo .ramMB): mostra RAM: NNN MB, warn (>700MB pill vermelho), warn amarelo >500MB, badge neutra se null
        const ramPill = buildRamPill(p.ramMB); // RAM por conta
        // Logs removidos para evitar poluição do console (ramMB null é normal para perfis inativos)

        // Exibir CPU percent (com null-aware)
        const cpuPill = buildCpuPill(p.cpuPercent);

        // ------------------- FROZEN/CONGELADO (ADICIONADO) -------------------
        // Militar: frozenUntil/COOLDOWN badge lógica
        const frozenPill = buildFrozenPill(p);

        // -----------------------------------------------------

        // CENTER: info
        const center = document.createElement('div'); center.className='centerCol';
        const titleRow = document.createElement('div'); titleRow.className='titleRow';
        const nameEl = document.createElement('div'); nameEl.className='accName';
        nameEl.textContent = `[${idxStr}] ${display}`; // <- enumerado
        titleRow.append(nameEl);

        // Pills (mantenha como já está, apenas reaproveite o código existente a partir daqui)
        titleRow.append(buildPill('Navegador '+(p.active?'Ativo':'Inativo'), p.active?'good':'bad'));
        titleRow.append(buildPill('Virtus '+(p.trabalhando?'Online':'Offline'), p.trabalhando?'good':'bad'));
        if (p.robeMode === 'veiculos') titleRow.append(buildPill('Modo: Veículos', 'info'));
        else titleRow.append(buildPill('Modo: Itens', 'info'));
        // PILL: Mensagem Personalizada Virtus
        if (
          p.customVirtusMessageEnabled &&
          typeof p.customVirtusMessage === 'string' &&
          p.customVirtusMessage.trim().length > 0
        ) {
          const pill = buildPill('Mensagem Personalizada', 'warn');
          pill.style.cursor = 'pointer';
          pill.title = p.customVirtusMessage;
          titleRow.append(pill);
        }

        // -------- RAM e CPU pill explícito ---------
        if (ramPill) titleRow.append(ramPill); // RAM por conta
        if (cpuPill) titleRow.append(cpuPill); // CPU por conta (null-aware)

        // -------- NOVO: Pill "Gordo" (>=600MB) — suprimido --------
        const gordoPill = buildGordoPill(p);
        if (gordoPill) titleRow.append(gordoPill);

        // -------- NOVO: Última manutenção e Δ última — suprimidos --------
        const lastMaintPill = buildLastMaintenancePill(p.lastMaintenanceAt);
        if (lastMaintPill) titleRow.append(lastMaintPill);
        const lastDeltaPill = buildLastDeltaPill(p.lastDeltaMB);
        if (lastDeltaPill) titleRow.append(lastDeltaPill);

        // -- NOVO: Ativação em espera/hold --
        if (activationHeldPill) titleRow.append(activationHeldPill);

        // -- NOVO: Reabrirá em... --
        if (reopenAtPill) titleRow.append(reopenAtPill);

        // ===================== NOVOS PILLS — STATUS MILITAR: BACKOFF/SWAP/HOLD/WHY-NOT-OPEN =====================
        {
          const now = Date.now();

          // Pill — BACKOFF DE ABERTURA/SWAP
          if (typeof p.openBackoffMs === "number" && (p.activationHeldUntil && p.activationHeldUntil > now)) {
            const restante = Math.max(0, Math.floor((p.activationHeldUntil - now)/1000));
            const backoffPill = buildPill(`Backoff de abertura (${tempoRestante(restante)})`, 'warn');
            backoffPill.title = `Abertura em backoff. O sistema está aguardando antes de abrir para evitar swap/thrashing.\nopenBackoffMs: ${p.openBackoffMs} ms\nLiberará em: ${new Date(p.activationHeldUntil).toLocaleString()}`;
            titleRow.append(backoffPill);
          }

          // Pill — SWAP cooldown
          if (typeof p.swapCooldown === "number" && p.swapCooldown > 0) {
            // tolerante: se vier em ms, converte para segundos
            const scSec = Math.floor(p.swapCooldown > 100000 ? p.swapCooldown/1000 : p.swapCooldown);
            const swapCdPill = buildPill(`Swap cooldown: ${tempoRestante(scSec)}`, 'warn');
            swapCdPill.title = `Aguardando cooldown de swap expirar para nova tentativa.`;
            titleRow.append(swapCdPill);
          }

          // Pill — Por que não abriu (whyNotOpen)
          if (typeof p.whyNotOpen === "string" && p.whyNotOpen.length > 0) {
            const whyPill = buildPill(`Por que não abriu: ${p.whyNotOpen}`, 'bad');
            whyPill.title = `Motivo registrado pelo sistema para não abrir o navegador.`;
            titleRow.append(whyPill);
          }

          // Pill — Último swap (somente últimos 30min)
          if (typeof p.lastSwapAt === "number" && now - p.lastSwapAt < 1800000) {
            const peer = p.lastSwapPeer || '';
            const dt = new Date(p.lastSwapAt).toLocaleTimeString();
            const swapPill = buildPill(`Último swap: ${peer ? peer + ', ' : ''}${dt}`, 'info');
            swapPill.title = `Última tentativa de swap${peer ? ` com ${peer}` : ''} em ${new Date(p.lastSwapAt).toLocaleString()}.`;
            titleRow.append(swapPill);
          }
        }
        // ===================== FIM NOVOS PILLS — STATUS MILITAR =====================

        // ---- ENTERPRISE: UMA ÚNICA PILL de estado final da conta ----
        {
          const stFinal = classifyAccountFinal(p, robes);
          if (stFinal && stFinal.kind && stFinal.kind !== 'ok') {
            const pill = buildPill(stFinal.label, stFinal.cls || 'warn');
            if (stFinal.title) pill.title = stFinal.title;
            titleRow.append(pill);
          }
        }

        // -------- FROZEN pill explícito (primeiro) ---------
        if (frozenPill) titleRow.append(frozenPill); // ROBO frozen: antiflood/antispam militar

        // -------- NOVO: Pill para manifestStatus --------
        if (p.manifestStatus === 'incomplete') {
          titleRow.append(buildPill('Manifesto incompleto', 'warn'));
        }
        if (p.manifestStatus === 'missing') {
          titleRow.append(buildPill('Manifesto ausente', 'bad'));
        }

        // Pill "Bloqueio temporário Messenger"
        if (typeof p.closingReason === 'string' && p.closingReason === 'virtus_block') {
          titleRow.append(buildPill('Bloqueio temporário Messenger', 'warn'));
        }

        // Pill “Robe em pausa 24h (FB bloqueado)” — só aparece se houve bloqueio real recente (pauseReason==='fb_block' + cooldown>22h + lastRobeBlockAt<25h)
        {
          const r = robes && robes[p.nome];
          if (
            !isFrozen &&
            p.manifestStatus === 'ok' &&
            p.closingReason !== 'virtus_block' &&
            r && r.cooldownSec > 80000 &&
            r.pauseReason === 'fb_block' &&
            r.lastRobeBlockAt && (Date.now() - r.lastRobeBlockAt) < 25*60*60*1000
          ) {
            titleRow.append(buildPill('Robe em pausa 24h (FB bloqueado)', 'bad'));
          }
        }
        // REMOVIDO (enterprise): “Robe: Limite atingido” duplicava o estado final "Limite excedido".

        // ------- COOLDOWN (ADICIONAL) -------
        if (robeCooldownSec > 0) {
          titleRow.append(buildCooldownPill(robeCooldownSec)); // Cooldown por perfil
        } else {
          if (isNext) titleRow.append(buildPill('Robe: Na fila (próximo)', 'info'));
          else if (inQueue) titleRow.append(buildPill('Robe: Aguardando fila', 'info'));
          else titleRow.append(buildPill('Robe: Pronto', 'good'));
        }

        // ------- Estado do robe ------
        if (robeStatus && robeStatus.estado) {
          titleRow.append(buildRobeEstadoPill(robeStatus.estado));
        }

        // Opcional: Adicione pill/status visual "Modo Humano"
        if (p.humanControl || p.humanHold) {
          const label = p.humanControl ? 'Modo Humano' : 'Modo Humano (hold)';
          titleRow.append(buildPill(label, 'warn'));
        }

        // ------------- ABAS/NUMPAGES PILL -------------
        // Militar: Se campo não for null, badge “Abas: N” para contas com N > 1 (alerta, cor de warning). Se null/undefined, simplesmente não exibir.
        const abasPill = buildAbasPill(p.numPages);
        if (abasPill) titleRow.append(abasPill);

        // Após montar as pills do Robe…
        const btnPlay = document.createElement('button');
        btnPlay.className='icon-btn mini btn-branco';
        btnPlay.title='Forçar postagem agora (Robe Play)';
        btnPlay.innerHTML = `<svg class="icon" viewBox="0 0 16 16" fill="currentColor"><polygon points="3,2 14,8 3,14"/></svg><span>Robe Play</span>`;
        btnPlay.onclick = () => robePlayUI(p, btnPlay);
        if (isFrozen) btnPlay.disabled = true;
        titleRow.append(btnPlay);

        // Novo botão: Robe 24h (por conta)
        const btnRobe24 = document.createElement('button');
        btnRobe24.className = 'icon-btn mini btn-azul';
        btnRobe24.title='Pausar Robe por 24h';
        btnRobe24.innerHTML = `<svg class="icon" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="6"/></svg><span>Robe 24h</span>`;
        btnRobe24.onclick = () => robePause24hUI(p, btnRobe24);
        if (isFrozen) btnRobe24.disabled = true;
        titleRow.append(btnRobe24);

        const subRow = document.createElement('div'); subRow.className='subRow';
        subRow.textContent = p.cidade ? ('Cidade: ' + p.cidade) : '';
        center.append(titleRow, subRow);

        // RIGHT: actions (ajustado conforme instruções)
        const right = document.createElement('div'); right.className='rightCol';

        // ===================== ALTERAÇÃO SOLICITADA — INÍCIO ======================
        const btnCookies = document.createElement('button');
        btnCookies.className='btn';
        btnCookies.textContent='Injetar Cookies';
        btnCookies.title='Injetar cookies salvos neste perfil';
        btnCookies.onclick = async (ev) => {
          setBtnLoading(btnCookies, true, 'Injetando...');
          try {
            const res = await window.electronAPI.configure(p.nome);
            if (!res || !res.ok) {
              alert('Falha ao injetar cookies: ' + (res && res.error ? res.error : 'erro desconhecido'));
            } else {
              alert('Cookies injetados com sucesso.');
            }
          } catch (e) {
            alert('Falha ao injetar cookies: ' + (e && e.message || e));
          } finally {
            setBtnLoading(btnCookies, false);
            reloadPerfis();
          }
        };
        if (isFrozen) btnCookies.disabled = true;
        // ===================== ALTERAÇÃO SOLICITADA — FIM ======================

        const btnCfg = document.createElement('button');
        btnCfg.className='icon-btn';
        btnCfg.title='Configurações da Conta';
        btnCfg.innerHTML = `<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Zm0-6 2.2 1.6 2.6-.6 1.1 2.5 2.6.6-.2 2.7 2 1.8-2 1.8.2 2.7-2.6.6-1.1 2.5-2.6-.6L12 22l-2.2-1.6-2.6.6-1.1-2.5-2.6-.6.2-2.7-2-1.8 2-1.8-.2-2.7 2.6-.6 1.1-2.5 2.6.6L12 2.5Z"/></svg><span>Configurar</span>`;
        btnCfg.onclick = () => showConfigPerfilModal({ perfil: p, onClose: reloadPerfis });
        if (isFrozen) btnCfg.disabled = true;

        // Botão Arquivo/Log por conta - alterado para ponto se issuesCount > 0
        const btnLog = document.createElement('button');
        btnLog.className='icon-btn';
        btnLog.title='Ver Log da Conta';
        btnLog.innerHTML = `<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm9 0v5h5"/></svg><span>Arquivo</span>${ (p.issuesCount && p.issuesCount > 0) ? '<span class="notif-dot"></span>' : '' }`;
        btnLog.onclick = () => showIssuesModal(p.nome);
        if (isFrozen) btnLog.disabled = true;

        // ========== ALTERAÇÃO AQUI: Botão Human/Resume conforme estado ==========
        if (p.humanControl) {
          // Botão “Retomar Trabalho”
          const btnResume = document.createElement('button');
          btnResume.className='icon-btn';
          btnResume.title='Retomar atendimento e automação';
          btnResume.innerHTML = `<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M13.41 7.41 12 6l-6 6 6 6 1.41-1.41L8.83 12z"/><path d="M18 6v12h-2V6h2z"/></svg><span>Retomar Trabalho</span>`;
          btnResume.onclick = async () => {
            btnResume.disabled = true;
            btnResume.innerText = 'Resumindo...';
            try {
              await window.electronAPI.resumeHuman(p.nome);
              await new Promise(r=>setTimeout(r,800));
              reloadPerfis();
            } catch(e){ alert('Falha ao retomar trabalho: '+(e&&e.message||e)); }
            finally{ btnResume.disabled=false; btnResume.innerHTML=`<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M13.41 7.41 12 6l-6 6 6 6 1.41-1.41L8.83 12z"/><path d="M18 6v12h-2V6h2z"/></svg><span>Retomar Trabalho</span>`; }
          };
          if (isFrozen) btnResume.disabled = true;
          right.append(btnCookies, btnResume, btnCfg, btnLog);
        } else {
          // Botão “Invocar Humano” padrão
          const btnHuman = document.createElement('button');
          btnHuman.className='icon-btn btn-amarelo';
          btnHuman.title='Invocar Humano';
          btnHuman.innerHTML = `<svg class="icon" viewBox="0 0 1024 1024" fill="currentColor"><circle cx="512" cy="352" r="216"/><ellipse cx="512" cy="800" rx="376" ry="184"/></svg><span>Invocar Humano</span>`;
          btnHuman.onclick = () => invocarHumanoUI(p, btnHuman);
          if (isFrozen) btnHuman.disabled = true;
          right.append(btnCookies, btnHuman, btnCfg, btnLog);
        }
        // ----------------------------------------------------------------------------------

        // ---------------------- RESETAR PERFIL MILITAR (opcional) ------------------------
        // Se RAM >700MB OU robeEstado anormal/erro, E não está congelado, ativo, resetando

    // 4.1 Helpers base (sleep/wait, formatadores):
    function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

    async function waitUntil(fnCond, { timeoutMs = 20000, intervalMs = 300 } = {}) {
      const t0 = Date.now();
      let lastError = null;
      let errorCount = 0;
      while ((Date.now() - t0) < timeoutMs) {
        try { 
          if (await fnCond()) return true; 
        } catch (e) {
          // CORREÇÃO 8: Loga erros ao invés de esconder (mas continua tentando)
          errorCount++;
          lastError = e;
          // Loga apenas a cada 5 erros para não poluir console
          if (errorCount % 5 === 0) {
            console.warn('[waitUntil] Erro na condição (continuando)', e && e.message || e, `(${errorCount} erros)`);
          }
        }
        await sleep(intervalMs);
      }
      // CORREÇÃO 8: Se timeout e houve erros, loga o último erro
      if (lastError && errorCount > 0) {
        console.warn('[waitUntil] Timeout após', errorCount, 'erros. Último erro:', lastError && lastError.message || lastError);
      }
      return false;
    }

    function passFilter(p) {
      let ok = true;

      if (currentFilter === 'active')         ok = !!p.active;
      else if (currentFilter === 'inactive')  ok = !p.active;

      // “Com problema”: qualquer estado final != ok
      else if (currentFilter === 'issues') {

        ok = !!st && st.kind !== 'ok';

      // Clicks das métricas: "Login requerido" (agregado)
      else if (currentFilter === 'login') {
        const st = classifyAccountFinal(p, lastRobesCache || {});
        ok = !!st && ['captcha','login','session','two_factor','identity','consent','unknown'].includes(st.kind);
      }
      else if (currentFilter === 'banned')    ok = (p.banned === true);

      if (!ok) return false;
      return passSearch(p);
    }

    // ======================= INÍCIO ALTERAÇÃO BLOQUEIO RAM "ABRIR TODOS" ========================
    // NOVO ensureResourcesOk({ minFreeMB }) militar
    async function ensureResourcesOk({ minFreeMB = 3072 } = {}) {
      const ok = await waitUntil(async () => {
        const m = await window.electronAPI.getSysMetrics().catch(()=>null);
        if (!m || !m.mem) return false;
        const freeMB = m.mem.freeMB || 0;
        const cpu    = (m.cpu && typeof m.cpu.percent === 'number') ? m.cpu.percent : 0;
        const cpuOk  = (cpu === 0) ? true : (cpu <= 90);
        const memOk  = freeMB >= minFreeMB;
        return cpuOk && memOk;
      }, { timeoutMs: 0x7fffffff, intervalMs: 1200 });
      return ok;
    }

          const st = await window.electronAPI.getStatus();

        }
        // Ordem: como retornado por /api/perfis

          // Re-checa status a cada iteração (robusto)
          try {
            await ensureResourcesOk({ minFreeMB: 3072 }); // ALTERAÇÃO: SEMPRE usa 3GB militar

            // Ativar navegador se necessário
            if (!p.active) {
              await window.electronAPI.activate(p.nome);
              // Espera ficar ativo

            await waitUntil(async () => {
              const st3 = await window.electronAPI.getStatus();
              const cur = (st3.perfis || []).find(x => x.nome === p.nome);
              return cur && cur.trabalhando;
            }, { timeoutMs: 30000, intervalMs: 400 });

            // Resgata lista atualizada para próximo ciclo via /api/perfis (NÃO usar /api/status)
            const lpNext = await window.electronAPI.listPerfis();
            const nextList = Array.isArray(lpNext) ? lpNext : (lpNext && Array.isArray(lpNext.perfis) ? lpNext.perfis : []);
            perfis.splice(0, perfis.length, ...(nextList || []));
          } catch (e) {
            console.warn('[StartAll] Falha em', p && p.nome, e && e.message || e);
          }
        }
      } catch (e) {
        alert('Falha na sequência: ' + (e && e.message || e));
      } finally {
        if (startBtn) { startBtn.disabled = false; startBtn.style.opacity = ''; startBtn.style.cursor = ''; startBtn.textContent = 'Abrir 24h'; }
        setGlobalActionButtonsDisabled(false);
        startAllLock = false;
        reloadPerfis();
      }

    // 4.4) Fechar todos em PARALELO com limite de concorrência (RÁPIDO e CONFIÁVEL)
    async function stopAllSequential() {
      if (stopAllLock) { alert('Fechamento em massa já está em andamento.'); return; }
      if (startAllLock) { alertMassActionRunning(); return; }
      stopAllLock = true;
      setGlobalActionButtonsDisabled(true);

      if (stopBtn) { stopBtn.disabled = true; stopBtn.style.opacity = '0.7'; stopBtn.style.cursor = 'not-allowed'; stopBtn.textContent = 'Fechando...'; }

      function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

      async function gatherActives() {
        const st = await window.electronAPI.getStatus().catch(()=>null);
        const arr = Array.isArray(st && st.perfis) ? st.perfis : [];
        return arr.filter(p => p && p.nome && p.active === true).map(p => ({ nome: p.nome }));
      }

      try {
        // PASSO 1 — Coleta inicial de ativos (active: true)
        let ativos = await gatherActives();
        const totalInicial = ativos.length;
        let closed = 0, failed = 0;

        if (totalInicial === 0) {
          if (stopBtn) stopBtn.textContent = 'Fechar Todos';
          stopAllLock = false;
          setGlobalActionButtonsDisabled(false);
          return;
        }

        // PASSO 2 — 1ª passada sequencial: fecha todos encontrados como ativos
        for (const { nome } of ativos) {
          try {
            const r = await window.electronAPI.deactivate(nome);
            if (!r || r.ok !== true) {
              failed++;
            } else {
              closed++;
            }
          } catch (e) {
            failed++;
            console.warn('[Fechar todos] falha ao fechar', nome, e && e.message || e);
          }
          if (stopBtn) stopBtn.textContent = `Fechando... ${closed + failed}/${totalInicial}`;
          await sleep(80);
        }

        // Pausa curta para estabilização de estados
        await sleep(1200);

        // PASSO 3 — 2ª passada (revarredura): fecha os que eventualmente permaneceram ativos
        let rem = await gatherActives();
        if (rem.length > 0) {
          for (const { nome } of rem) {
            try {
              const r = await window.electronAPI.deactivate(nome);
              if (!r || r.ok !== true) {
                failed++;
              } else {
                closed++;
              }
            } catch (e) {
              failed++;
              console.warn('[Fechar todos][retry] falha ao fechar', nome, e && e.message || e);
            }
            if (stopBtn) stopBtn.textContent = `Fechando... ${closed + failed}/${totalInicial}`;
            await sleep(100);
          }
        }

        // PASSO 4 — Verificação final: quantos permanecem ativos?
        const aindaAtivos = await gatherActives();
        if (aindaAtivos.length > 0) {
          console.warn('[Fechar todos] perfis ainda ativos após 2 passadas:', aindaAtivos.map(x => x.nome));
          alert('Atenção: ' + aindaAtivos.length + ' perfil(is) ainda está(ão) ativo(s). Execute novamente para forçar o fechamento.');
        } else {
          console.log('[Fechar todos] Concluído. Encerrados:', closed, 'Falhas:', failed);
        }

        await sleep(600);
        reloadPerfis();

      } catch (e) {
        console.error('[Fechar todos] Erro crítico', e && e.message || e, e);
        alert('Falha ao fechar todos: ' + (e && e.message || e));
      } finally {
        if (stopBtn) { stopBtn.disabled = false; stopBtn.style.opacity = ''; stopBtn.style.cursor = ''; stopBtn.textContent = 'Fechar Todos'; }
        setGlobalActionButtonsDisabled(false);
        stopAllLock = false;
      }
    }

    // Bind do botão "Fechar todos"
    (function bindStopAllBtn(){
      const btn = document.getElementById('stopAllBtn');
      if (!btn) return;
      btn.onclick = stopAllSequential;
    })();

    // Bind do botão "Abrir Todos e Iniciar 24h"
    (function bindStartAllBtn(){
      const btn = document.getElementById('startAllBtn');
      if (!btn) return;
      btn.onclick = startAllSequential;
    })();

    // Bind do botão "Invocar Tudo"
    (function bindInvokeAllBtn(){
      const btn = document.getElementById('invokeAllBtn');
      if (!btn) return;
      btn.onclick = async () => {
        if (isMassActionRunning()) { alertMassActionRunning(); return; }
        const idleTxt = btn.textContent;
        btn.disabled = true; btn.style.opacity='0.7'; btn.textContent='Invocando...';
        setGlobalActionButtonsDisabled(true, { exclude: ['invokeAllBtn'] });
        try {
          const r = await window.electronAPI.invokeHumanAllActive();
          if (!r || !r.ok) {
            alert('Falha ao invocar humano em massa: ' + ((r && r.error) || ''));
          }
          await new Promise(r=>setTimeout(r,500));
          reloadPerfis();
        } catch (e) {
          alert('Erro no Invocar Tudo: ' + (e && e.message || e));
        } finally {
          btn.disabled = false; btn.style.opacity=''; btn.textContent = idleTxt;
          setGlobalActionButtonsDisabled(false);
        }
      };
    })();

    // Robe 24h (todos)
    (function bindRobeAll(){
      const btn24 = document.getElementById('robe24AllBtn');
      if (btn24) {
        btn24.onclick = async () => {
          if (isMassActionRunning()) { alertMassActionRunning(); return; }
          if (!btn24.dataset.idleTxt) btn24.dataset.idleTxt = btn24.textContent;
          btn24.disabled = true; btn24.style.opacity='0.7'; btn24.textContent='Pausando 24h...';
          try { await window.electronAPI.robesPause24hAll(); await new Promise(r=>setTimeout(r,300)); reloadPerfis(); }
          catch(e){ alert('Falha ao pausar 24h todos: ' + (e&&e.message||e)); }
          finally { btn24.disabled=false; btn24.style.opacity=''; btn24.textContent=btn24.dataset.idleTxt; }
        };
      }
      const btnRel = document.getElementById('robeReleaseAllBtn');
      if (btnRel) {
        btnRel.onclick = async () => {
          if (isMassActionRunning()) { alertMassActionRunning(); return; }
          if (!btnRel.dataset.idleTxt) btnRel.dataset.idleTxt = btnRel.textContent;
          btnRel.disabled = true; btnRel.style.opacity='0.7'; btnRel.textContent='Liberando...';
          try { await window.electronAPI.robesReleaseAll(); await new Promise(r=>setTimeout(r,300)); reloadPerfis(); }
          catch(e){ alert('Falha ao liberar Robe: ' + (e&&e.message||e)); }
          finally { btnRel.disabled=false; btnRel.style.opacity=''; btnRel.textContent=btnRel.dataset.idleTxt; }
        };
      }
    })();

    // Toolbar: botão "Descongelar todos"
    (function bindUnfreezeAllBtn(){
      const btn = document.getElementById('unfreezeAllBtn');
      if (!btn) return;
      btn.onclick = async () => {
        if (isMassActionRunning()) { alertMassActionRunning(); return; }
        if (!confirm('Descongelar todos os perfis agora?')) return;
        btn.disabled = true; btn.textContent = 'Descongelando...';
        try {
          const r = await fetch('/api/perfis/unfreeze-all', { method: 'POST' }).then(r=>r.json());
          if (!r || !r.ok) alert('Falha ao descongelar todos: ' + ((r && r.error) || ''));
          await new Promise(r=>setTimeout(r, 600));
          reloadPerfis();
        } catch (e) {
          alert('Erro ao descongelar todos: ' + (e && e.message || e));
        } finally {
          btn.disabled = false;
          btn.textContent = 'Descongelar';
        }
      };
    })();

    // Bind do botão "Retomar Tudo"
    (function bindResumeAllBtn(){
      const btn = document.getElementById('resumeAllBtn');
      if (!btn) return;
      btn.onclick = async () => {
        if (isMassActionRunning()) { alertMassActionRunning(); return; }
        const idleTxt = btn.textContent;
        massMiscLock = true;
        btn.disabled = true; btn.style.opacity='0.7'; btn.textContent='Retomando...';
        setGlobalActionButtonsDisabled(true, { exclude: ['resumeAllBtn'] });
        try {
          const r = await window.electronAPI.resumeHumanAllActive();
          if (!r || !r.ok) {
            alert('Falha ao retomar trabalho em massa: ' + ((r && r.error) || ''));
          }
          await new Promise(r=>setTimeout(r,500));
          reloadPerfis();
        } catch (e) {
          alert('Erro no Retomar Tudo: ' + (e && e.message || e));
        } finally {
          massMiscLock = false;
          btn.disabled = false; btn.style.opacity=''; btn.textContent = idleTxt;
          setGlobalActionButtonsDisabled(false);
        }
      };
    })();

    reloadPerfis();
    setInterval(reloadPerfis, 5000);

    // Chamada inicial das métricas:
    updateSysMetrics();

    // Ajuste dinâmico e robusto do offset das barras fixas e padding do conteúdo
    (function initStickyToolbarOffset(){
      try {
        const header = document.querySelector('header');
        const toolbar = document.querySelector('.toolbar-sticky');
        const wrap = document.querySelector('.wrap');
        if (!header || !toolbar || !wrap) return;

        const apply = () => {
          // Garante FIXAÇÃO ABSOLUTA
          header.style.position = 'fixed';
          header.style.top = '0px';
          header.style.left = '0px';
          header.style.width = '100%';

          // Altura real do header
          const h = Math.ceil(header.getBoundingClientRect().height || header.offsetHeight || 0);

          // Toolbar fixa, imediatamente abaixo do header
          toolbar.style.position = 'fixed';
          toolbar.style.top = (isNaN(h) ? 0 : h) + 'px';
          toolbar.style.left = '0px';
          toolbar.style.width = '100%';

          // Altura real da toolbar
          const t = Math.ceil(toolbar.getBoundingClientRect().height || toolbar.offsetHeight || 0);

          // Padding-top do conteúdo: header + toolbar + pequeno gap
          const extraGap = 6;
          const pad = (isNaN(h) ? 0 : h) + (isNaN(t) ? 0 : t) + extraGap;
          wrap.style.paddingTop = pad + 'px';
        };

        // Aplica já no início
        apply();

        // Atualiza em redimensionamentos (desktop/mobile)
        window.addEventListener('resize', apply);
        window.addEventListener('orientationchange', apply);

        // Observa mudanças de tamanho do header (quebras de linha das métricas, etc.)
        if (window.ResizeObserver) {
          const ro = new ResizeObserver(apply);
          ro.observe(header);
          ro.observe(toolbar);
          // Guarda referência para evitar coleta prematura em alguns engines
          window.__headerResizeObserver = ro;
        }

        // Observa mutações no conteúdo do header (troca de textos das métrricas)
        if (window.MutationObserver) {
          const mo = new MutationObserver(apply);
          mo.observe(header, { childList: true, subtree: true, characterData: true });
          window.__headerMutationObserver = mo;
        }

        // Ajuste tardio para casos de fontes/carregamento assíncrono
        setTimeout(apply, 200);
      } catch (e) {
        // Fallback: CSS top default atua
      }
    })();

  </script>
